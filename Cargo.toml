[package]
name = "liims-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A native GTK browser for LIIMS public inquiry terminals"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
webkit6 = { version = "0.6.1", features = ["v2_48"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
url = "2.5"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
